server {
    listen 80;
    server_name 13.233.236.74;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 13.233.236.74;

    ssl_certificate /etc/ssl/certs/dg.crt;
    ssl_certificate_key /etc/ssl/private/dg.key;

    location /static/ {
        alias /home/ubuntu/drowsiness-detection/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}