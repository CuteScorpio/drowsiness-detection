# /etc/nginx/sites-available/drowseguard
#
# CRITICAL: HTTPS is REQUIRED for camera access on mobile browsers (Chrome/Safari).
# This config sets up SSL termination via Let's Encrypt (Certbot).

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Permissions Policy — allow camera
    add_header Permissions-Policy "camera=(self), microphone=()";

    # Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Increase body size for base64 image frames
        client_max_body_size 5M;
    }

    # Static files with caching
    location /static/ {
        alias /home/ubuntu/drowsiness-detection/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
